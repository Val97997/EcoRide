services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:8.0
    ports:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword   # Change in production
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: apppassword          # Change in production
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  ###< doctrine/doctrine-bundle ###

  ###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
  ###< symfony/mailer ###

  ###> doctrine/mongodb-odm-bundle ###
  mongodb:
    image: mongo:6.0
    command: ["mongod", "--noauth"]   # Disable authentication  # Change in production
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: EcoRide
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  ###< doctrine/mongodb-odm-bundle ###

volumes:
  database_data:
  mongodb_data:
